---
name: Unit Tests

on:
  push:

env:
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: 123456789123456789123
  AWS_SECRET_ACCESS_KEY: just_to_make_boto3_imports_work

jobs:
  mypy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Quoted otherwise treated as a float literal (3.10 == 3.1)
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: pipx install "poetry>=2.3,<2.4"

      - run: poetry sync

      - run: poetry run mypy xoto3

  unit-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Quoted otherwise treated as a float literal (3.10 == 3.1)
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: pipx install "poetry>=2.3,<2.4"

      - run: poetry sync

      - run: poetry run pytest tests
